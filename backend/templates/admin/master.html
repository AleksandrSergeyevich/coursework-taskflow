{% extends 'admin/base.html' %}

{% block head %}
    {{ super() }}
    <style>
        .logout-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .logout-btn:hover {
            background: #c82333;
        }
    </style>
{% endblock %}

{% block body %}
    {{ super() }}
    {% if session.is_admin %}
        <a href="/admin/logout" class="logout-btn">🚪 Выйти</a>
    {% endif %}
{% endblock %}
