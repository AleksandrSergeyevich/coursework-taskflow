name: ProdBoost CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_pass
  SECRET_KEY: test-secret-key-for-ci

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest psycopg2-binary black flake8

    - name: Check code formatting
      run: |
        cd backend
        black --check . || echo "Formatting check failed - run 'black .' locally"

    - name: Setup test environment
      run: |
        cd backend
        echo "SECRET_KEY=${{ env.SECRET_KEY }}" > .env.test
        echo "DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}" >> .env.test
        echo "DEBUG=True" >> .env.test

    - name: Run tests
      env:
        DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        SECRET_KEY: ${{ env.SECRET_KEY }}
      run: |
        cd backend
        python -m pytest tests/ -v --cov=. --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: success()
      with:
        file: ./backend/coverage.xml

  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      run: |
        docker compose build
        echo "✅ Docker images built successfully"

    - name: Test Docker containers
      run: |
        # Запускаем контейнеры
        docker compose up -d
        
        # Ждем пока сервисы запустятся
        sleep 15
        
        # Проверяем здоровье сервисов
        docker compose ps
        
        # Проверяем доступность приложения
        for i in {1..10}; do
          if curl -f http://localhost:5000/health; then
            echo "✅ Application is healthy"
            break
          fi
          echo "⏳ Waiting for application to start... ($i/10)"
          sleep 5
        done
        
        # Логи если что-то пошло не так
        if ! curl -f http://localhost:5000/health; then
          echo "❌ Application health check failed"
          docker compose logs
          exit 1
        fi
        
        # Останавливаем контейнеры
        docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test-docker
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        # Здесь будут команды деплоя
        # Например: ssh, kubectl, docker push и т.д.
        echo "✅ Deployment placeholder"
