name: ProdBoost CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest

    - name: Create test .env
      run: |
        mkdir -p backend
        echo "SECRET_KEY=test" > backend/.env
        echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> backend/.env

    - name: Wait for PostgreSQL
      run: |
        python - <<EOF
import time
import psycopg2

for i in range(30):
    try:
        psycopg2.connect(
            host='localhost',
            port=5432,
            user='test_user',
            password='test_pass',
            dbname='test_db'
        )
        print('✅ DB ready')
        exit(0)
    except:
        time.sleep(1)
print('❌ DB failed')
exit(1)
EOF

    - name: Build Docker images
      run: docker compose build

    - name: Report success
      run: echo "✅ CI passed"
