name: ProdBoost CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov  # ← Добавлены тестовые зависимости

    - name: Create test .env file
      run: |
        mkdir -p backend
        echo "SECRET_KEY=test_secret_key" > backend/.env
        echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> backend/.env

    - name: Wait for PostgreSQL
      run: |
        cd backend
        python -c "
import time, psycopg2
for i in range(30):
    try:
        psycopg2.connect(host='localhost', port=5432, user='test_user', password='test_pass', dbname='test_db')
        print('✅ PostgreSQL ready')
        exit(0)
    except Exception as e:
        print(f'⏳ Waiting ({i+1}/30)...')
        time.sleep(1)
print('❌ PostgreSQL failed to start')
exit(1)
"

    - name: Initialize database
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      run: |
        python -c "from app import db; db.create_all(); print('✅ DB tables created')"

    - name: Run health check
      working-directory: backend
      env:
        DATABASE, I want to know if it's possible to automatically generate a summary of our conversation so far.
