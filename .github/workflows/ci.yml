name: ProdBoost CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create test .env file
      run: |
        cd backend
        echo "SECRET_KEY=test_secret_key" > .env
        echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> .env
        echo "TELEGRAM_BOT_TOKEN=test_bot_token" >> .env
        echo "GITHUB_TOKEN=test_github_token" >> .env
        echo "SMTP_USERNAME=test@example.com" >> .env
        echo "SMTP_PASSWORD=test_password" >> .env

    - name: Wait for PostgreSQL
      run: |
        cd backend
        python - <<EOF
import time
import psycopg2
import os

max_retries = 10
retry_delay = 2

for i in range(max_retries):
    try:
        conn = psycopg2.connect(
            host='localhost',
            port=5432,
            user='test_user',
            password='test_pass',
            dbname='test_db'
        )
        conn.close()
        print("✅ PostgreSQL is ready!")
        exit(0)
    except Exception as e:
        print(f"⏳ Waiting for PostgreSQL... ({i+1}/{max_retries})")
        print(f"Error: {e}")
        time.sleep(retry_delay)

print("❌ PostgreSQL is not available after multiple retries")
exit(1)
EOF

    - name: Run database migrations
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      run: |
        python -c "from app import db; db.create_all()"
        echo "✅ Database tables created"

    - name: Run health check
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      run: |
        python -c "import requests; response = requests.get('http://localhost:5000/health'); print(f'Status code: {response.status_code}'); print(f'Response: {response.text}')"
      
    - name: Run tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        SECRET_KEY: test_secret_key
        TELEGRAM_BOT_TOKEN: test_bot_token
        GITHUB_TOKEN: test_github_token
      run: |
        pytest --cov=. --cov-report=xml
        echo "✅ Tests completed successfully"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
      if: always()
