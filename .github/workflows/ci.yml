name: ProdBoost CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Wait for PostgreSQL
      run: |
        cd backend
        python -c "import time, psycopg2; 
        for i in range(30): 
            try: 
                psycopg2.connect(host='localhost', port=5432, user='test_user', password='test_pass', dbname='test_db'); 
                exit(0)
            except Exception as e: 
                print(f'Waiting for DB... {e}'); 
                time.sleep(1)
        exit(1)"

    - name: Run tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        SECRET_KEY: test_secret_key
      run: |
        python -c "import sys, subprocess, json, os, time, signal, threading, pytest, coverage"
        pytest --cov=.
