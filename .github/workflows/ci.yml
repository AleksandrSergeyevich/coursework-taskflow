name: ProdBoost CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_pass
  SECRET_KEY: test-secret-key-for-ci
  FLASK_ENV: testing

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install black flake8 bandit

    - name: Check code formatting with Black
      run: |
        cd backend
        black --check --diff .

    - name: Lint with flake8
      run: |
        cd backend
        flake8 . --count --show-source --statistics --max-line-length=88

    - name: Security scan with Bandit
      run: |
        cd backend
        bandit -r . -f json -o bandit-report.json || true

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Wait for PostgreSQL
      env:
        PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}; then
            echo "✅ PostgreSQL is ready"
            break
          fi
          echo "⏳ Waiting for PostgreSQL... ($i/30)"
          sleep 1
        done

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov psycopg2-binary

    - name: Setup test environment
      run: |
        mkdir -p backend
        echo "SECRET_KEY=${{ env.SECRET_KEY }}" > backend/.env.test
        echo "DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}" >> backend/.env.test
        echo "DEBUG=True" >> backend/.env.test
        echo "FLASK_ENV=testing" >> backend/.env.test

    - name: Clean test database
      env:
        PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
      run: |
        psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -c "
          DROP TABLE IF EXISTS alembic_version CASCADE;
          DROP TABLE IF EXISTS task CASCADE;
          DROP TABLE IF EXISTS \"user\" CASCADE;
        " || echo "No tables to drop or error occurred"

    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        SECRET_KEY: ${{ env.SECRET_KEY }}
        DEBUG: "True"
      run: |
        cd backend
        pytest tests/ -v \
          --cov=. \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term

    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      if: success()
      with:
        file: ./backend/coverage.xml
        flags: unittests

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_integration_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest requests

    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_integration_db
        SECRET_KEY: integration-test-key
      run: |
        cd backend
        python -m pytest tests/integration/ -v || echo "No integration tests found"

  build-docker:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker compose build
        echo "✅ Docker images built successfully"

    - name: Test Docker image
      run: |
        docker compose up -d
        sleep 10
        curl -f http://localhost:5000/health || (docker compose logs && exit 1)
        docker compose down

  notify:
    runs-on: ubuntu-latest
    needs: build-docker
    if: always()
    
    steps:
    - name: Check pipeline status
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Pipeline completed successfully!"
        else
          echo "❌ Pipeline failed!"
          exit 1
        fi
