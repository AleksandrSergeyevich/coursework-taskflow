name: ProdBoost CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Create test environment file
      run: |
        mkdir -p backend
        echo "SECRET_KEY=test_secret_key" > backend/.env
        echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> backend/.env
        echo "TELEGRAM_BOT_TOKEN=test_bot_token" >> backend/.env
        echo "GITHUB_TOKEN=test_github_token" >> backend/.env
        echo "SMTP_USERNAME=test@example.com" >> backend/.env
        echo "SMTP_PASSWORD=test_password" >> backend/.env

    - name: Wait for PostgreSQL
      run: |
        python - <<'EOF'
import time
import psycopg2

max_retries = 10
retry_delay = 2

for i in range(max_retries):
    try:
        conn = psycopg2.connect(
            host='localhost',
            port=5432,
            user='test_user',
            password='test_pass',
            dbname='test_db'
        )
        conn.close()
        print("✅ PostgreSQL is ready!")
        exit(0)
    except Exception as e:
        print(f"⏳ Waiting for PostgreSQL... ({i+1}/{max_retries})")
        print(f"Error: {e}")
        time.sleep(retry_delay)

print("❌ PostgreSQL is not available after multiple retries")
exit(1)
EOF

    - name: Run database migrations
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      run: |
        python -c "from app import db; db.create_all()"
        echo "✅ Database tables created"

    - name: Run application tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        SECRET_KEY: test_secret_key
      run: |
        python -c "import pytest; exit(pytest.main(['-v']))"
        echo "✅ Tests completed successfully"

    - name: Start application for health check
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        FLASK_APP: app.py
        FLASK_ENV: development
      run: |
        nohup python app.py > app.log 2>&1 &
        sleep 5
        echo "✅ Application started in background"

    - name: Run health check
      run: |
        echo "✅ Checking backend health..."
        if curl -f http://localhost:5000/health; then
          echo "💚 Backend health check passed"
        else
          echo "❌ Backend health check failed"
          cat backend/app.log
          exit 1
        fi

    - name: Build Docker images
      run: |
        docker compose build
        echo "✅ Docker images built successfully"

    - name: Run Docker containers
      run: |
        docker compose up -d
        echo "✅ Docker containers started successfully"

    - name: Verify services are running
      run: |
        echo "✅ Checking backend availability..."
        if curl -f http://localhost:5000/health; then
          echo "💚 Backend is responding"
        else
          echo "❌ Backend is NOT responding"
          docker compose logs backend
          exit 1
        fi
        
        echo "✅ Checking frontend availability..."
        if curl -f http://localhost:80; then
          echo "💚 Frontend is responding"
        else
          echo "❌ Frontend is NOT responding"
          docker compose logs frontend
          exit 1
        fi
        
        echo "✅ FULL SYSTEM IS RUNNING SUCCESSFULLY!"

    - name: Stop containers
      if: always()
      run: |
        echo "🛑 Stopping all containers..."
        docker compose down

    - name: Upload coverage report (if exists)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend/htmlcov/
        if-no-files-found: ignore

    - name: Final status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🎉 CI pipeline completed successfully!"
        else
          echo "🚨 CI pipeline failed!"
          exit 1
        fi
