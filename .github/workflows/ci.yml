name: ProdBoost CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_taskflow_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Create test .env file
      run: |
        mkdir -p backend
        echo "SECRET_KEY=test_secret_key" > backend/.env
        echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_taskflow_db" >> backend/.env
        echo "TELEGRAM_BOT_TOKEN=test_bot_token" >> backend/.env
        echo "GITHUB_TOKEN=test_github_token" >> backend/.env

    - name: Wait for PostgreSQL
      run: |
        python -c "
import time, psycopg2
for i in range(10):
    try:
        psycopg2.connect(host='localhost', port=5432, user='test_user', password='test_pass', dbname='test_taskflow_db')
        print('✅ PostgreSQL ready')
        exit(0)
    except:
        print(f'⏳ Waiting ({i+1}/10)')
        time.sleep(2)
print('❌ PostgreSQL failed')
exit(1)
"

    - name: Initialize database
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_taskflow_db
      run: |
        python -c "from app import db; db.create_all(); print('✅ Tables created')"

    - name: Run health check
      working-directory: backend
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_taskflow_db
      run: |
        python -c "
import subprocess, sys, time, requests
proc = subprocess.Popen([sys.executable, 'app.py'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
time.sleep(5)
try:
    resp = requests.get('http://localhost:5000/health', timeout=5)
    assert resp.status_code == 200
    assert resp.json() == {'status': 'OK'}
    print('✅ Health check passed')
except Exception as e:
    print(f'❌ Health check failed: {e}')
    proc.terminate()
    sys.exit(1)
proc.terminate()
"

    - name: Build and test Docker images
      run: |
        docker compose build
        echo "✅ Docker images built"

    - name: Start services with Docker Compose
      run: |
        docker compose up -d
        echo "✅ Services started"

    - name: Verify full system via HTTP
      run: |
        # Проверка бэкенда
        if curl -f http://localhost:5000/health; then
          echo "✅ Backend OK"
        else
          echo "❌ Backend failed"
          docker compose logs backend
          exit 1
        fi

        # Проверка фронтенда
        if curl -f http://localhost:8080; then
          echo "✅ Frontend OK"
        else
          echo "❌ Frontend failed"
          docker compose logs frontend
          exit 1
        fi

        echo "🎉 FULL SYSTEM VALIDATION SUCCESSFUL!"

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v

    - name: Upload logs on failure (optional)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs-on-failure
        path: |
          /tmp
        if-no-files-found: ignore
